name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # No docgen-action step here: deployment to GitHub Pages (blueprint + home_page/ homepage +
      # docs) is `blueprint.yml`'s job. This workflow runs on every push/PR (not just main), and
      # the pinned docgen-action@v1 release here predates the `deploy` input — it always
      # deploys, with no opt-out — so keeping it would race blueprint.yml's deploy and could
      # overwrite the fuller site with a bare doc-gen4-only one (which is what happened).
