name: Compile blueprint

# Builds the blueprint and the home page and deploys the site to GitHub Pages. The API docs are
# built by the "API documentation" workflow (docs.yml); this workflow copies in the docs from
# its latest successful run, and runs again whenever that workflow succeeds.

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  workflow_run:
    workflows: ["API documentation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read          # Read access to repository contents
  actions: read           # Download the API docs artifact
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens

jobs:
  build_project:
    # Skip when triggered by a failed docs run: there is nothing new to deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # One deployment at a time, queued rather than cancelled. Set on the job, not the workflow,
    # so that a skipped run (after a failed docs run) does not cancel a running deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Pinned with Ruby 3.1 below: home_page/Gemfile.lock (nokogiri 1.13.6) does not install on Ruby 3.4.
    runs-on: ubuntu-24.04
    name: Build project
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: true
          mk_all-check: true

      - name: Check blueprint label integrity
        run: python3 scripts/check_blueprint_labels.py

      - name: Build blueprint nodes
        run: lake build :blueprint

      - name: Compile blueprint and home page
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # 2026-10-05: lists the project after doc-gen4 in the docbuild lakefile, so our pinned doc-gen4 wins
        with:
          api-docs: false
          blueprint: true
          deploy: false
          homepage: home_page
          ruby-version: "3.1"

      # Copied after Jekyll so that Jekyll does not process the thousands of doc pages.
      - name: Add API documentation from the latest successful docs run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docs.yml --branch main \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n api-docs -D home_page/_site/docs
          else
            echo "::warning::No successful API documentation run found; deploying without /docs."
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: home_page/_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
