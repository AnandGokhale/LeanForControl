name = "LeanForControl"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanForControl"]
lintDriver = "runLinter"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# No v4.36.0 tag exists; v4.36.0-rc2 is the newest release for this toolchain.
[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.36.0-rc2"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.36.0"

# Mathlib must be required LAST: a later `require` takes precedence for shared dependencies, and
# LeanArchitect pins batteries at v4.36.0-rc2. Requiring mathlib last keeps batteries (and
# mathlib's other dependencies) at the versions mathlib's prebuilt cache was built with.
# Same mathlib as LinearSystems (tag v4.36.0 = fc4f59e).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "LeanForControl"

[[lean_exe]]
name = "runLinter"
srcDir = "scripts"
supportInterpreter = true
